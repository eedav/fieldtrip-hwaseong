<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef3f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="탐사기록장"></head><body>
<title>국가지질공원 탐사 기록장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: 상단 고정 퍼즐 띠(진행상황) → 학생·답사 정보 → 지점 목록 → 지점 기록(관찰 칸 3개 + 알게 된 것·질문·키워드). 모바일 우선, 최대 760px. */
:root{
  --paper:#eef3f7; --sheet:#ffffff; --ink:#172433; --ink-2:#536476; --rule:#d2dce5; --grid:#e1e9f0;
  --dino:#24598c; --dino-soft:#dde9f5;   /* 공룡알 화석지: 깊은 바다색 */
  --uum:#127186;  --uum-soft:#d8eef2;    /* 우음도: 청록 갯벌물 */
  --end:#4552a0;  --end-soft:#e2e5f5;    /* 마무리: 남색 */
  --site:var(--dino); --site-soft:var(--dino-soft);
  --ok:#2f7a4d; --danger:#b3261e; --gold:#c08a1e;
  --f-display:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-hand:"Nanum Pen Script","Apple SD Gothic Neo",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111820;--sheet:#19222c;--ink:#e5edf4;--ink-2:#9db0c1;--rule:#2c3a48;--grid:#212c38;
  --dino:#7db4e6;--dino-soft:#1b2d40;--uum:#62c3d3;--uum-soft:#163238;--end:#a6b1f0;--end-soft:#252b47;--ok:#6fcf97;--danger:#ff8a80;--gold:#f0c060;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111820;--sheet:#19222c;--ink:#e5edf4;--ink-2:#9db0c1;--rule:#2c3a48;--grid:#212c38;
  --dino:#7db4e6;--dino-soft:#1b2d40;--uum:#62c3d3;--uum-soft:#163238;--end:#a6b1f0;--end-soft:#252b47;--ok:#6fcf97;--danger:#ff8a80;--gold:#f0c060;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}   /* 숨김이 다른 display 규칙에 지지 않도록 */
#printRoot{display:none}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--sheet) 94%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--rule);
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.actionbar .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr 1.25fr;gap:6px}
.ab{font:inherit;font-size:12.5px;line-height:1.25;text-align:center;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:6px 4px;cursor:pointer;min-width:0}
.ab svg{width:20px;height:20px;flex:none}
.ab.main{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ab:focus-visible{outline:3px solid color-mix(in srgb,var(--site) 55%,transparent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
body[data-area="uum"]{--site:var(--uum);--site-soft:var(--uum-soft)}
body[data-area="end"],body[data-area="report"]{--site:var(--end);--site-soft:var(--end-soft)}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* 공룡알 부화 띠 */
.eggbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--paper);padding-block:8px;border-bottom:1px solid var(--rule);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.eggbar .in{max-width:760px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.eggrow{display:flex;align-items:center;gap:12px}
.strip{display:flex;flex-direction:column;gap:6px}
.striprow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-bottom:2px}
.striprow::-webkit-scrollbar{display:none}
.strip .grp{flex:none;align-self:center;font-family:var(--f-display);font-weight:700;font-size:12px;color:var(--c);padding-left:4px}
.strip .np{flex:none;white-space:nowrap;min-height:38px}
.eggbar svg.egg{width:40px;height:48px;flex:none;overflow:visible}
.egginfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.egghead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.egghead b{font-family:var(--f-display);font-size:15px}
.eggcount{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.eggcount em{font-style:normal;color:var(--ink);font-size:16px}
.pips{display:flex;gap:5px}
.pip{width:100%;max-width:26px;height:7px;border-radius:4px;background:var(--grid);border:1px solid var(--rule)}
.pip.on{background:var(--gold);border-color:var(--gold)}
.eggmsg{font-size:12.5px;line-height:1.4;color:var(--ink-2)}
.eggmsg button{font:inherit;font-weight:600;color:var(--gold);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.egg .shell{transform-box:fill-box;transform-origin:50% 90%}
.egg.shake .shell{animation:shake .6s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
.egg .crack{opacity:0;transition:opacity .3s}
.egg .crack.on{opacity:1}
.egg .baby{transform-box:fill-box;transform-origin:50% 100%}
.egg.hatch .baby{animation:hatch .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes hatch{0%{transform:translateY(14px) scale(.6)}100%{transform:none}}
.dlg{position:fixed;inset:0;z-index:36;background:rgba(10,20,30,.45);display:flex;align-items:flex-end;justify-content:center}
.dlg .card{background:var(--sheet);color:var(--ink);border-radius:16px 16px 0 0;width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg h3{margin:0;font-family:var(--f-display);font-size:19px}
.dlg .who{font-size:15px}
.dlg .who b{font-family:var(--f-display)}
.dlg .btnrow .btn{flex:1;justify-content:center}
.dlg .okmsg{color:var(--ok);font-weight:600;margin:0}
.dlg .errmsg{color:var(--danger);margin:0;font-size:14px}
.celebrate{position:fixed;inset:0;z-index:38;background:color-mix(in srgb,var(--paper) 92%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.celebrate svg{width:170px;height:200px;overflow:visible}
.celebrate h2{font-family:var(--f-display);font-weight:800;font-size:28px;margin:0;color:var(--gold)}
.celebrate p{margin:0;font-size:16px}
.celebrate .who{font-family:var(--f-hand);font-size:30px;line-height:1.2}

header.top{display:flex;flex-direction:column;gap:10px;padding-top:14px}
.infocard{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;display:flex;flex-direction:column}
.infosum{font:inherit;text-align:left;background:none;border:0;color:var(--ink);padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;min-height:48px}
.infosum .sum{flex:1;min-width:0;font-size:15px}
.infosum .sum b{font-family:var(--f-display)}
.infosum .sum .muted{font-size:13.5px}
.infosum .edit{font-size:13px;font-weight:600;color:var(--site);flex:none}
.infocard .info{padding:0 14px 14px}
.infodone{display:flex;justify-content:flex-end}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--ink-2);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,6vw,32px);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
.info{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.info .w2{grid-column:span 2}
.field label,.field .lab{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
input[type=text],input[type=date],textarea{width:100%;font:inherit;color:var(--ink);background:var(--sheet);border:1.5px solid var(--rule);border-radius:8px;padding:9px 11px;min-width:0}
input:focus,textarea:focus{outline:none;border-color:var(--site);box-shadow:0 0 0 3px color-mix(in srgb,var(--site) 20%,transparent)}
textarea{min-height:100px;resize:vertical;line-height:1.65}
textarea::placeholder,input::placeholder{color:color-mix(in srgb,var(--ink-2) 75%,transparent)}
.weather{display:flex;flex-wrap:wrap;gap:6px}
.wx{font:inherit;font-size:14.5px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:6px 13px;min-height:38px;cursor:pointer}
.wx[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.status{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.status.warn i{background:var(--danger)}

/* 지점 목록 */
.nav{display:flex;flex-direction:column;gap:10px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:12px}
.navgrp{display:flex;flex-direction:column;gap:6px}
.navgrp > span{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--c)}
.navrow{display:flex;flex-wrap:wrap;gap:6px}
.np{font:inherit;font-size:14px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.np .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
.np.done{border-color:var(--c);background:var(--cs)}
.np.done::after{content:"✓";color:var(--c);font-weight:700}
.np[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--c);border-color:var(--c)}

.site-head{display:flex;flex-direction:column;gap:6px;border-left:6px solid var(--site);padding:4px 0 4px 14px}
.site-head h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0;line-height:1.25;text-wrap:balance}
.site-head p{margin:0;color:var(--ink-2);font-size:14.5px;max-width:62ch}
.strata{font-family:var(--f-mono);font-size:12px;color:var(--site);letter-spacing:.04em}

.check{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--ink-2)}
.check span::before{content:"○ ";color:var(--rule)}
.check span.ok{color:var(--ink)}
.check span.ok::before{content:"● ";color:var(--site)}

.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;align-items:start}
.refs figure{margin:0;display:flex;flex-direction:column;gap:4px}
.refs img{width:100%;height:auto;max-width:100%;display:block;border-radius:8px;border:1px solid var(--rule);background:#fff;cursor:zoom-in}
.refs figcaption{font-size:13.5px;color:var(--ink-2)}

section.block{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.block h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:17px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.block h3 .hint{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--ink-2)}

.slots{display:flex;flex-direction:column;gap:14px}
.slot{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px dashed var(--rule)}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.imgcard{display:flex;flex-direction:column;gap:6px;min-width:0}
.imgcard input{font-size:14px;padding:7px 9px}
.imgcard .mact{gap:5px}
.imgcard .mini{font-size:13px;padding:5px 9px;min-height:34px}
.tw{position:relative}
.xdel{position:absolute;right:5px;top:5px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(20,26,25,.72);color:#fff;font-size:19px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.addrow{display:flex;gap:8px}
.addrow .btn{flex:1;justify-content:center}
.locbox{display:flex;flex-direction:column;gap:8px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
.loctitle{font-family:var(--f-display);font-weight:700;font-size:15px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.loctitle span{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--ink-2)}
.locline{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink);overflow-wrap:anywhere}
.locrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
a.mini{text-decoration:none;display:inline-flex;align-items:center;color:var(--site);font-weight:600}
.locerr{font-size:13.5px;color:var(--danger);margin:0}
.rep-slot{display:flex;flex-direction:column;gap:6px}
.rep-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.rep-imgs figure{margin:0}
.rep-imgs img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:1px solid var(--rule)}
.rep-imgs figcaption{font-size:12px;color:var(--ink-2)}
.slot:first-child{border-top:0;padding-top:0}
.slot-lab{grid-column:1/-1;font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--site);margin-bottom:-4px}
.simg{display:flex;flex-direction:column;gap:6px;min-width:0}
.empty{aspect-ratio:4/3;max-width:100%;border:1.5px dashed var(--rule);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;background:repeating-linear-gradient(0deg,transparent 0 19px,var(--grid) 19px 20px),repeating-linear-gradient(90deg,transparent 0 19px,var(--grid) 19px 20px)}
.thumb{position:relative;aspect-ratio:4/3;max-width:100%;width:100%;border-radius:8px;overflow:hidden;border:1px solid var(--rule);background:var(--grid);cursor:zoom-in;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.kind{position:absolute;left:6px;top:6px;font-family:var(--f-mono);font-size:10.5px;background:rgba(20,26,25,.75);color:#fff;border-radius:4px;padding:1px 6px}
.mact{display:flex;flex-wrap:wrap;gap:6px}
.mini{font:inherit;font-size:13.5px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink-2);border-radius:7px;padding:6px 10px;min-height:36px;cursor:pointer}
.mini.del{color:var(--danger)}
.slot textarea{min-height:110px}
.stext{display:flex;flex-direction:column;min-width:0;align-self:stretch}
.stext textarea{flex:1;min-height:120px}

.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:9px;padding:9px 14px;min-height:42px;cursor:pointer;border:1.5px solid var(--site);background:var(--site);color:var(--sheet);display:inline-flex;align-items:center;gap:8px}
.btn.sm{font-size:14px;padding:7px 11px}
.btn.ghost{background:transparent;color:var(--site)}
.btn.plain{border-color:var(--rule);background:var(--sheet);color:var(--ink)}
.btn.danger{border-color:var(--danger);background:transparent;color:var(--danger)}
.btn svg{width:18px;height:18px;flex:none}
.btn:focus-visible,button:focus-visible{outline:3px solid color-mix(in srgb,var(--site) 55%,transparent);outline-offset:2px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;font-weight:500;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:7px 14px;min-height:40px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--site);border-color:var(--site);color:var(--sheet)}
.chip.custom{border-style:dashed}
.addkw{display:flex;gap:8px}
.addkw input{flex:1;min-width:0;font-size:14.5px}
.kwnotes{display:flex;flex-direction:column;gap:12px}
.kwnote{border-left:3px solid var(--site);padding-left:12px;display:flex;flex-direction:column;gap:6px}
.kwnote label{font-weight:600;font-size:15px}
.kwnote label b{font-family:var(--f-display);color:var(--site)}
.kwnote textarea{min-height:76px}
.kwempty{font-size:14px;color:var(--ink-2);margin:0}

.pager{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

.rep{display:flex;flex-direction:column;gap:16px}
.rep-site{border-top:4px solid var(--c);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.rep-site h3{margin:0;font-family:var(--f-display);font-size:18px}
.rep-site h4{margin:4px 0 0;font-size:14px;color:var(--ink-2);font-weight:600}
.rep-site p{margin:0;white-space:pre-wrap}
.rep-obs{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:start}
.rep-obs img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:1px solid var(--rule)}
.muted{color:var(--ink-2)}
.note{font-size:13.5px;color:var(--ink-2);margin:0}
.confirm{border:1.5px solid var(--danger);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--sheet)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}

.modal{position:fixed;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));gap:10px}
.mbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.mbar h3{margin:0;font-family:var(--f-display);font-size:17px}
.tools{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;align-items:center;padding-block:4px;scrollbar-width:none}
.tools > *{flex:none}
.tools::-webkit-scrollbar{display:none}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--rule);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--site);outline-offset:2px}
.tool{font:inherit;font-size:14px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:7px 11px;min-height:38px;cursor:pointer;white-space:nowrap}
.tool[aria-pressed="true"]{border-color:var(--site);background:var(--site-soft)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage canvas{max-width:100%;max-height:100%;background:#fff;border-radius:6px;border:1px solid var(--rule);touch-action:none;cursor:crosshair}
.zoom{position:fixed;inset:0;z-index:35;background:rgba(10,14,13,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.zoom img{max-width:100%;max-height:80vh;object-fit:contain;border-radius:6px}
.zoom p{color:#e8ece8;margin:0;font-family:var(--f-hand);font-size:24px;text-align:center}
.zoom .btn{border-color:#e8ece8;color:#e8ece8;background:transparent}
@media (max-width:520px){
  .info{grid-template-columns:repeat(2,minmax(0,1fr))}.info .w2{grid-column:1/-1}
  h1{font-size:22px}
  .slot{grid-template-columns:1fr;gap:8px}
  .empty{aspect-ratio:auto;flex-direction:row;padding:14px;min-height:68px}
  .empty .btn{flex:1;justify-content:center}
  .stext textarea{min-height:96px}
  section.block{padding:14px}
  .site-head h2{font-size:21px}
  .pager .btn{flex:1;justify-content:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rep-obs{grid-template-columns:90px minmax(0,1fr)}
  .ab{font-size:12px;padding:5px 2px}
}
@media (prefers-reduced-motion:reduce){.egg.shake .shell,.egg.hatch .baby{animation:none}}

<div class="eggbar" id="topbar"><div class="in">

<div class="wrap">
  <header class="top">

    <section class="infocard">

</div>

const blankState = () => ({ v:2, info:{ no:"", name:"", date:"", weather:"", wx:"", places:[] }, sites:Object.fromEntries(SITES.map(s=>[s.id, blankSite()])), end:{ learned:"", more:"" }, doneAt:{} });

function normalize(d){
  const b = blankState();
  if(!d || typeof d !== "object") return b;
  b.info = Object.assign(b.info, d.info || {}); if(!Array.isArray(b.info.places)) b.info.places = [];
  b.end = Object.assign(b.end, d.end || {});
  b.doneAt = d.doneAt || {};
  for(const s of SITES){
    const src = (d.sites || {})[s.id];
    if(!src) continue;
    const x = Object.assign(blankSite(), src);
    x.slots = Array.from({length:SLOTS}, (_,i) => {
      const o = (src.slots || [])[i] || {};
      const imgs = Array.isArray(o.imgs) ? o.imgs : (o.src ? [{ id:uid(), src:o.src, orig:o.orig||"", type:o.type||"photo", cap:"" }] : []);
      return { imgs, text: o.text || "" };
    });
    b.sites[s.id] = x;
  }
  return b;
}

function el(tag, attrs={}, ...kids){
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==="class") n.className=v; else if(k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if(v===true) n.setAttribute(k,""); else if(v!==false && v!=null) n.setAttribute(k,v);
  }
  for(const c of kids.flat()) if(c!=null && c!==false) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}

async function saveFile(filename, data, mime){
  try{
    if(window.claude && typeof window.claude.use==="function"){
      const d = await window.claude.use("downloads");
      if(d){ try{ await d.save({filename, data:new Blob([data],{type:mime})}); toast("파일을 저장했어요"); return; }
        catch(e){ if(e&&e.code==="declined"){ toast("저장을 취소했어요"); return; } if(e&&e.code==="rate_limited"){ toast("잠시 후 다시 눌러 주세요"); return; } } }
    }
  }catch(e){}
  try{ const url=URL.createObjectURL(new Blob([data],{type:mime})); const a=el("a",{href:url,download:filename}); document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast("파일을 저장했어요"); }
  catch(e){ toast("이 화면에서는 파일 저장이 안 돼요"); }
}

/* ---------- 완성 판정 ---------- */
function siteStatus(id){
  const D = state.sites[id];
  const slots = D.slots.filter(s => s.imgs.length && s.text.trim()).length;
  const learned = !!D.learned.trim();
  const kws = Object.values(D.kw).filter(v => v.trim()).length;
  return { slots, learned, kws, complete: slots>=RULE.slots && (!RULE.learned || learned) && kws>=RULE.keywords };
}

function eggSVG(n){
  const shellFill = `fill="#efe3c8" stroke="#7a5a44" stroke-width="1.4"`;
  const specks = SPECKS.map(([x,y,r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#b89a74" opacity=".55"/>`).join("");
  if(n >= GOAL){
    const bottom = "M4,44 L10,37 L16,45 L22,36 L28,44 L34,36 L40,44 L46,37 L52,44 L56,43 C56,58 44,68 30,68 C16,68 4,58 4,44 Z";
    return `<g class="shell">${babySVG()}<path d="${bottom}" ${shellFill}/>
      <circle cx="16" cy="54" r="1.4" fill="#b89a74" opacity=".55"/><circle cx="40" cy="58" r="1.2" fill="#b89a74" opacity=".55"/>
      <g transform="rotate(-24 22 10)"><path d="M14,14 C15,6 22,2 30,3 C34,3 37,5 39,8 L35,11 L31,8 L27,12 L22,9 L18,13 Z" ${shellFill}/></g>

  }
  const cracks = CRACKS.map((d,i) => `<path class="crack${i < n ? " on" : ""}" d="${d}" fill="none" stroke="#5a4632" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>`).join("");

  return `<g class="shell"><path d="${EGG_PATH}" ${shellFill}/>${specks}${cracks}${peek}</g>`;
}
let shown = null, lastEgg = -1;
function celebrate(){
  const t = new Date(state.allAt || Date.now());
  const svg = `<svg viewBox="-4 -4 68 76" aria-hidden="true">${eggSVG(GOAL)}</svg>`;
  const c = el("div",{class:"celebrate", role:"dialog", "aria-modal":"true", "aria-label":"부화 성공"});
  c.innerHTML = svg;
  c.append(el("h2",{},"부화 성공!"),
    el("p",{class:"who"}, `${state.info.no} ${state.info.name}`.trim() || "탐사대원"),
    el("p",{}, `${t.getMonth()+1}월 ${t.getDate()}일 ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")} · ${SITES.filter(s=>siteStatus(s.id).complete).length}곳 완성`),
    el("p",{class:"note"},"이 화면을 선생님께 보여주세요."),
    el("button",{class:"btn", type:"button", onclick:()=>c.remove()},"닫기"));
  document.body.append(c); c.querySelector("button").focus();
}
function refreshProgress(){
  const st = SITES.map(s => siteStatus(s.id).complete);
  const done = st.filter(Boolean).length;
  const n = Math.min(done, GOAL), bonus = Math.max(0, done - GOAL);
  const egg = $("#egg");
  if(n !== lastEgg){
    egg.innerHTML = eggSVG(n);
    if(lastEgg >= 0 && shown){
      egg.classList.remove("shake","hatch"); void egg.getBBox();
      if(n > lastEgg) egg.classList.add(n >= GOAL ? "hatch" : "shake");
    }
    lastEgg = n;
  }
  $("#eggCount").innerHTML = `<em>${n}</em> / ${GOAL}${bonus ? ` · 보너스 +${bonus}` : ""}`;
  const pips = $("#pips");
  if(pips.children.length !== GOAL){ pips.innerHTML = ""; for(let i=0;i<GOAL;i++) pips.append(el("span",{class:"pip"})); }
  [...pips.children].forEach((p,i) => p.classList.toggle("on", i < n));
  const msg = $("#eggMsg"); msg.innerHTML = "";
  if(n >= GOAL){
    if(!state.allAt) state.allAt = Date.now();
    msg.append("부화 성공! ", el("button",{type:"button", onclick:celebrate},"부화 인증 보기"));
  } else {
    delete state.allAt;
    msg.textContent = n === 0 ? `지점을 완성할 때마다 금이 가요 · ${GOAL}곳이면 부화!` : n === GOAL-1 ? "안에서 누가 보고 있어요… 한 곳만 더!" : `부화까지 ${GOAL-n}곳 남았어요`;
  }
  // 새로 완성된 지점 알림
  if(shown){
    const j = st.findIndex((v,i) => v && !shown[i]);
    if(j >= 0){
      if(n >= GOAL && done === GOAL) setTimeout(celebrate, 700);
      else toast(n >= GOAL ? `${SITES[j].name} 완성! 보너스 +${bonus}` : `${SITES[j].name} 완성! 알에 금이 갔어요 (${n}/${GOAL})`);
    }
  }
  SITES.forEach((s,i)=>{ if(st[i] && !state.doneAt[s.id]) state.doneAt[s.id] = Date.now(); });
  shown = st;
  document.querySelectorAll(".np[data-id]").forEach(b => b.classList.toggle("done", siteStatus(b.dataset.id).complete));
}

function markNav(){
  let cur = null;
  document.querySelectorAll(".np").forEach(b => { const v = b.dataset.id || b.dataset.v; if(v===view){ b.setAttribute("aria-current","page"); cur = b; } else b.removeAttribute("aria-current"); });
  if(cur){ const nav = cur.parentElement; const l = cur.offsetLeft - nav.offsetLeft, r = l + cur.offsetWidth;
    if(l < nav.scrollLeft + 8 || r > nav.scrollLeft + nav.clientWidth - 8) nav.scrollTo({left: Math.max(0, l - 64), behavior:"smooth"}); }
}

/* ---------- 사진 ---------- */
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }) }
function readFile(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); }) }
async function shrink(u, max=1400, q=.78){ const img=await loadImg(u); const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); return c.toDataURL("image/jpeg",q); }
let photoTarget = null;
const photoInput = $("#photoInput");
function pickPhotos(id, i){ photoTarget = {id, i}; photoInput.click(); }
photoInput.addEventListener("change", async () => {

  const { id, i } = photoTarget; setStatus("사진 정리하는 중…");

});

  const S = SITES[siteIdx(id)], A = AREAS[S.area], D = state.sites[id], idx = siteIdx(id);
  const main = $("#main"); main.innerHTML = "";

  main.append(el("div",{class:"site-head"},
    el("div",{class:"strata"}, `${idx+1} / ${SITES.length} · ${A.short}`),
    el("h2",{}, S.name),
    S.guide ? el("p",{}, S.guide) : null,
    el("div",{class:"check", id:"check"})));

  main.append(el("div",{class:"locbox", id:"loc"}));

  // 참고 사진 (있을 때만 보임)
  const refs = el("div",{class:"refs", id:"refs", hidden:true});
  const list = (S.ref || [REF_DIR + id + ".jpg"]).map(r => typeof r === "string" ? { src:r, cap:"" } : r);
  list.forEach(({src, cap}, k) => {
    const label = cap || (list.length>1 ? `참고 사진 ${k+1}` : "참고 사진");
    const img = el("img",{src, alt:label});
    const fig = el("figure",{hidden:true}, img, el("figcaption",{}, label));

    img.addEventListener("error", () => fig.remove());
    img.addEventListener("click", () => zoom(src, label));
    refs.append(fig);
  });
  main.append(refs);

  main.append(el("section",{class:"block"},
    el("h3",{}, "관찰 기록", el("span",{class:"hint"},"칸마다 사진이나 스케치(여러 장 가능), 그리고 오감을 이용한 관찰 기록")),
    el("div",{class:"slots", id:"slots"})));

  const area = (key, title, hint, ph) => {
    const ta = el("textarea",{id:`${id}-${key}`, placeholder:ph}); ta.value = D[key];
    ta.addEventListener("input", () => { D[key] = ta.value; save(); renderCheck(); });
    return el("section",{class:"block"}, el("h3",{}, el("label",{for:`${id}-${key}`}, title), el("span",{class:"hint"}, hint)), ta);

const fmtTime = t => { const d = new Date(t); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };

function getLoc(id){
  locErr = "";
  if(!("geolocation" in navigator)){ locErr = "이 화면에서는 위치를 쓸 수 없어요. 아래에 직접 적어 주세요."; renderLoc(); return; }
  locBusy = true; renderLoc();
  navigator.geolocation.getCurrentPosition(pos => {
    locBusy = false;
    state.sites[id].loc = { lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy, t: Date.now() };
    save(); if(view === id) renderLoc(); toast("위치를 기록했어요");
  }, err => {
    locBusy = false;
    locErr = err && err.code === 1 ? "위치 권한이 꺼져 있어요. 휴대폰 설정에서 허용하거나, 아래에 직접 적어 주세요." : "위치를 잡지 못했어요. 잠시 후 다시 누르거나, 아래에 직접 적어 주세요.";

<h3>배운 키워드</h3>${ks.length?ks.map(k=>`<div class="kw"><b>${esc(k)}</b><p>${esc(D.kw[k].trim()||"(내용 없음)")}</p></div>`).join(""):`<p class="e">고른 키워드 없음</p>`}</section>`;
  });
  html += `<h2 class="area" style="color:#4552a0">마무리</h2><section style="--c:#4552a0"><h3>오늘 새롭게 보고 배운 점</h3>${p(state.end.learned)}<h3>돌아가 더 알아볼 점</h3>${p(state.end.more)}</section>`;
  const done = SITES.filter(s=>siteStatus(s.id).complete).length;
  return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(fileStem())}</title><style>${css}</style></head><body>
<h1>화성 국가지질공원 탐사 보고서</h1><p class="meta">${esc(I.no)} ${esc(I.name)}</p><p class="meta">탐사일 ${esc(I.date||"-")} · 날씨 ${esc(I.weather||"-")}${I.wx?` · ${esc(I.wx)}`:""}${I.places.length?` · 장소 ${esc(I.places.join(", "))}`:""} · 완성 지점 ${done}/${SITES.length}</p>${html}</body></html>`;
}

/* ---------- 확대 ---------- */
function zoom(src, cap){
  const z = el("div",{class:"zoom", role:"dialog", "aria-modal":"true", "aria-label":"크게 보기"}, el("img",{src, alt:cap||""}), cap ? el("p",{},cap) : null, el("button",{class:"btn", type:"button", onclick:()=>z.remove()},"닫기"));
  z.addEventListener("click", e => { if(e.target===z) z.remove(); });
  document.body.append(z); z.querySelector("button").focus();
}

/* ---------- 스케치 ---------- */
async function openSketch(id, i, j){
  const slot = state.sites[id].slots[i];
  const img = j == null ? null : slot.imgs[j];
  let W = 1200, H = 900, bg = null;
  if(img){ bg = await loadImg(img.src); const k=Math.min(1,1600/Math.max(bg.naturalWidth,bg.naturalHeight)); W=Math.round(bg.naturalWidth*k); H=Math.round(bg.naturalHeight*k); }
  const onPhoto = !!img && img.type === "photo";
  const base = document.createElement("canvas"); base.width=W; base.height=H; const b=base.getContext("2d");
  b.fillStyle="#fff"; b.fillRect(0,0,W,H);
  if(bg) b.drawImage(bg,0,0,W,H);
  else { b.strokeStyle="#e3e8e1"; b.lineWidth=1; for(let x=0;x<=W;x+=30){b.beginPath();b.moveTo(x+.5,0);b.lineTo(x+.5,H);b.stroke()} for(let y=0;y<=H;y+=30){b.beginPath();b.moveTo(0,y+.5);b.lineTo(W,y+.5);b.stroke()} }
  const ink = document.createElement("canvas"); ink.width=W; ink.height=H; const ic=ink.getContext("2d"); ic.lineCap="round"; ic.lineJoin="round";
  const cv = el("canvas",{width:W, height:H, "aria-label":"스케치 영역"}); const vc = cv.getContext("2d");
  const paint = () => { vc.clearRect(0,0,W,H); vc.drawImage(base,0,0); vc.drawImage(ink,0,0); }; paint();
  const colors = onPhoto ? ["#ffd400","#ff3b30","#ffffff","#1e2624","#2f7dff"] : ["#1e2624","#a8482a","#2f6fd6","#3f6b5c","#c9a227"];
  let color = colors[0], size = 6, erase = false; const undo = [];
  const sw = colors.map(c => el("button",{class:"sw", type:"button", style:`background:${c}`, "aria-label":"펜 색", onclick:()=>{ color=c; erase=false; sync(); }}));
  const SZ = [3,6,14];
  const sizes = SZ.map((s,j) => el("button",{class:"tool", type:"button", onclick:()=>{ size=s; sync(); }}, ["가늘게","보통","굵게"][j]));
  const eraser = el("button",{class:"tool", type:"button", onclick:()=>{ erase=!erase; sync(); }}, "지우개");
  const undoB = el("button",{class:"tool", type:"button", onclick:()=>{ const s=undo.pop(); if(s){ ic.putImageData(s,0,0); paint(); } }}, "되돌리기");
  const clearB = el("button",{class:"tool", type:"button", onclick:()=>{ undo.push(ic.getImageData(0,0,W,H)); ic.clearRect(0,0,W,H); paint(); }}, "새로 그린 것 지우기");
  function sync(){ sw.forEach((x,j)=>x.setAttribute("aria-pressed",String(!erase&&colors[j]===color))); sizes.forEach((x,j)=>x.setAttribute("aria-pressed",String(SZ[j]===size))); eraser.setAttribute("aria-pressed",String(erase)); }
  sync();
  let drawing=false, last=null;
  const pos = e => { const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*W/r.width, (e.clientY-r.top)*H/r.height]; };
  function stroke(a,c,e){ const sc=W/(cv.getBoundingClientRect().width||W); const pr=e.pointerType==="pen"&&e.pressure?(.5+e.pressure):1;
    ic.globalCompositeOperation = erase ? "destination-out" : "source-over"; ic.strokeStyle=color; ic.lineWidth=(erase?size*3:size)*sc*pr;
    ic.beginPath(); ic.moveTo(a[0],a[1]); ic.lineTo(c[0],c[1]); ic.stroke(); paint(); }
  cv.addEventListener("pointerdown", e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); if(undo.length>25) undo.shift(); undo.push(ic.getImageData(0,0,W,H)); drawing=true; last=pos(e); stroke(last,last,e); });
  cv.addEventListener("pointermove", e => { if(!drawing) return; const q=pos(e); stroke(last,q,e); last=q; });
  cv.addEventListener("pointerup", ()=>drawing=false); cv.addEventListener("pointercancel", ()=>drawing=false);
  const close = () => { m.remove(); document.body.style.overflow=""; };
  const done = () => {
    const out=document.createElement("canvas"); out.width=W; out.height=H; const o=out.getContext("2d"); o.drawImage(base,0,0); o.drawImage(ink,0,0);
    const src = out.toDataURL("image/jpeg",.85);
    if(img){ if(onPhoto && !img.orig) img.orig = img.src; img.src = src; }
    else slot.imgs.push({ id:uid(), src, orig:"", type:"sketch", cap:"" });
    close(); renderSlots(); save(); renderCheck(); toast(onPhoto ? "사진에 표시를 저장했어요" : "스케치를 저장했어요");
  };
  const m = el("div",{class:"modal", role:"dialog", "aria-modal":"true", "aria-label":"스케치"},
    el("div",{class:"mbar"}, el("h3",{}, onPhoto ? `관찰 ${i+1} · 사진 위에 표시하기` : `관찰 ${i+1} · 스케치`),
      el("div",{class:"btnrow"}, el("button",{class:"btn plain", type:"button", onclick:close},"취소"), el("button",{class:"btn", type:"button", onclick:done},"저장"))),
    el("div",{class:"tools"}, ...sw, el("span",{style:"width:6px"}), ...sizes, eraser, undoB, clearB),
    el("div",{class:"stage"}, cv),
    el("p",{class:"note", style:"margin:0"}, onPhoto ? "지층 경계, 휘어진 방향, 자갈 등을 선으로 표시해 보세요. '표시 지우기'로 원래 사진으로 돌아갈 수 있어요." : "옆에 대략의 크기(cm)와 방향을 함께 적어 두면 좋아요."));
  document.body.append(m); document.body.style.overflow="hidden";
}

/* ---------- 화면 전환 ---------- */
function show(v){
  view = v;
  const S = SITES[siteIdx(v)];
  document.body.dataset.area = S ? S.area : v;
  if(S) renderSite(v); else if(v==="end") renderEnd(); else renderReport();
  markNav(); refreshProgress();
  try{ localStorage.setItem("hwaseong-view", v); }catch(e){}
}

/* ---------- 학생·답사 정보 ---------- */
function renderInfoSum(){
  const I = state.info, open = !$("#infoBody").hidden;
  const sum = $("#infoSum"); sum.innerHTML = ""; sum.setAttribute("aria-expanded", String(open));
  const who = `${I.no} ${I.name}`.trim();
  const short = I.places.map(n => (Object.values(AREAS).find(a=>a.name===n)||{short:n}).short).join(", ");
  const bits = [I.date ? I.date.slice(5).replace("-","/") : "", I.weather, short].filter(Boolean).join(" · ");
  sum.append(el("span",{class:"sum"}, el("b",{}, who || "탐사 정보"), " ", el("span",{class:"muted"}, bits || (who ? "탐사일·날씨·장소를 적어 주세요" : "학번, 이름, 탐사일, 날씨, 장소"))),
    el("span",{class:"edit"}, open ? "접기" : "수정"));
}
function setInfoOpen(open){ $("#infoBody").hidden = !open; renderInfoSum(); }
$("#infoSum").addEventListener("click", () => setInfoOpen($("#infoBody").hidden));
$("#infoDone").addEventListener("click", () => setInfoOpen(false));
function bindInfo(){
  $("#sno").value = state.info.no; $("#sname").value = state.info.name; $("#sdate").value = state.info.date; $("#swx").value = state.info.wx;
  document.querySelectorAll("#weather .wx").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.w === state.info.weather)));
  document.querySelectorAll("#places .wx").forEach(b => b.setAttribute("aria-pressed", String(state.info.places.includes(b.dataset.p))));
  renderInfoSum();
}
const wbox = $("#weather");
WEATHER.forEach(w => wbox.append(el("button",{class:"wx", type:"button", "data-w":w, "aria-pressed":"false", onclick:()=>{ state.info.weather = state.info.weather===w ? "" : w; bindInfo(); save(); }}, w)));
const pbox = $("#places");
Object.values(AREAS).forEach(A => pbox.append(el("button",{class:"wx", type:"button", "data-p":A.name, "aria-pressed":"false", onclick:()=>{
  const P = state.info.places, k = P.indexOf(A.name); if(k >= 0) P.splice(k,1); else P.push(A.name); bindInfo(); save(); }}, A.name)));
[["sno","no"],["sname","name"],["sdate","date"],["swx","wx"]].forEach(([id,k]) => $("#"+id).addEventListener("input", e => { state.info[k] = e.target.value; save(); renderInfoSum(); }));

/* ---------- 하단 고정 버튼 ---------- */
$("#abSave").addEventListener("click", () => saveFile(`${fileStem()}_백업.json`, JSON.stringify(state), "application/json"));
$("#abLoad").addEventListener("click", () => $("#backupInput").click());
$("#abReport").addEventListener("click", () => {
  if(!state.info.no.trim() || !state.info.name.trim()){
    toast("맨 위에 학번과 이름을 먼저 적어 주세요");
    window.scrollTo({top:0, behavior:"smooth"});
    setTimeout(() => $(state.info.no.trim() ? "#sname" : "#sno").focus({preventScroll:true}), 350);
    return;
  }
  printReport();
});

/* ---------- PDF로 저장 (휴대폰 인쇄 기능 사용) ---------- */
function printReport(){
  const doc = new DOMParser().parseFromString(buildReport(), "text/html");
  const css = [...doc.querySelectorAll("style")].map(x => x.textContent).join("\n");
  let root = $("#printRoot");
  if(!root){ root = el("div",{id:"printRoot"}); document.body.append(root); }
  root.innerHTML = `<style>@media print{ body > *:not(#printRoot){display:none!important} #printRoot{display:block!important} ${css} @page{margin:12mm} }</style>` + doc.body.innerHTML;
  const prevTitle = document.title; document.title = `${fileStem()}_보고서`;   // PDF 파일 이름으로 쓰임
  const done = () => { document.title = prevTitle; root.innerHTML = ""; window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done);
  const imgs = [...root.querySelectorAll("img")];
  Promise.all(imgs.map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; }))).then(() => {
    try{ window.print(); }catch(e){ toast("이 화면에서는 인쇄가 안 돼요. [HTML 파일로 저장]을 써 주세요."); done(); }
  });
}

/* ---------- 선생님께 제출 ---------- */
async function smallSrcs(){   // 보낼 때만 사진을 줄여 용량 낮추기
  const map = new Map();
  for(const S of SITES) for(const sl of state.sites[S.id].slots) for(const m of sl.imgs){
    try{ map.set(m.id, await shrink(m.src, 1000, .7)); }catch(e){ map.set(m.id, m.src); }
  }
  return map;
}
async function postReport(payload){
  const body = JSON.stringify(payload);
  try{
    const r = await fetch(SUBMIT_URL, { method:"POST", body });
    const j = await r.json();
    if(!j.ok) throw Object.assign(new Error(j.error || "서버 오류"), { server:true });
    return "ok";
  }catch(e){
    if(e.server) throw e;
    await fetch(SUBMIT_URL, { method:"POST", mode:"no-cors", body });   // 응답을 못 읽는 환경: 보내기만
    return "sent";
  }
}
function openSubmit(){
  if(!state.info.no.trim() || !state.info.name.trim()){
    toast("맨 위에 학번과 이름을 먼저 적어 주세요");
    window.scrollTo({top:0, behavior:"smooth"}); setInfoOpen(true);
    setTimeout(() => $(state.info.no.trim() ? "#sname" : "#sno").focus({preventScroll:true}), 350);
    return;
  }
  const done = SITES.filter(s=>siteStatus(s.id).complete).length;
  const photos = SITES.reduce((n,S)=>n + state.sites[S.id].slots.reduce((k,sl)=>k+sl.imgs.length,0), 0);
  const close = () => d.remove();
  const card = el("div",{class:"card", role:"dialog", "aria-modal":"true", "aria-label":"선생님께 제출"});
  const d = el("div",{class:"dlg"}, card);
  d.addEventListener("click", e => { if(e.target === d) close(); });
  card.append(el("h3",{},"선생님께 제출"));
  if(!SUBMIT_URL){
    card.append(el("p",{class:"note"},"아직 선생님이 제출 기능을 켜지 않았어요. 아래 [보고서 저장]으로 파일을 저장해 두세요."),
      el("div",{class:"btnrow"}, el("button",{class:"btn plain", type:"button", onclick:close},"닫기")));
    document.body.append(d); return;
  }
  card.append(el("p",{class:"who", style:"margin:0"}, el("b",{}, `${state.info.no} ${state.info.name}`), ` · 완성 ${done}/${SITES.length}곳 · 사진·스케치 ${photos}장`),
    el("p",{class:"note"}, "보고서가 선생님 구글 드라이브에 저장돼요. 다시 제출하면 가장 최근 것으로 바뀌어요."),
    state.submittedAt ? el("p",{class:"note"}, `지난 제출: ${new Date(state.submittedAt).getMonth()+1}/${new Date(state.submittedAt).getDate()} ${fmtTime(state.submittedAt)}`) : "");
  const msg = el("div",{});
  const go_ = el("button",{class:"btn", type:"button"}, "제출하기");
  const cancel = el("button",{class:"btn plain", type:"button", onclick:close}, "취소");
  card.append(msg, el("div",{class:"btnrow"}, cancel, go_));
  go_.addEventListener("click", async () => {
    go_.disabled = true; cancel.disabled = true; msg.innerHTML = "";
    go_.textContent = "사진 줄이는 중…";
    try{
      const map = await smallSrcs();
      go_.textContent = "보내는 중…";
      const res = await postReport({ key:SUBMIT_KEY, filename:`${fileStem()}_보고서.html`, html: buildReport(m => map.get(m.id) || m.src),
        no: state.info.no.trim(), name: state.info.name.trim(), done, total: SITES.length });
      state.submittedAt = Date.now(); save();
      msg.append(el("p",{class:"okmsg"}, res === "ok" ? `제출 완료! (${fmtTime(state.submittedAt)})` : `보냈어요 (${fmtTime(state.submittedAt)}). 선생님께 잘 받았는지 확인해 보세요.`));
      go_.hidden = true; cancel.disabled = false; cancel.textContent = "닫기";
    }catch(e){
      msg.append(el("p",{class:"errmsg"}, e && e.server ? `제출하지 못했어요: ${e.message}. 선생님께 알려 주세요.` : "인터넷 연결을 확인하고 다시 눌러 주세요. 안 되면 [보고서 저장]으로 파일을 저장해 두세요."));
      go_.disabled = false; cancel.disabled = false; go_.textContent = "다시 제출하기";
    }
  });
  document.body.append(d); go_.focus();
}
$("#abSubmit").addEventListener("click", openSubmit);

/* ---------- 시작 ---------- */
(async function boot(){
  buildNav(); renderInfoSum();
  let v = "d0"; try{ v = localStorage.getItem("hwaseong-view") || "d0"; }catch(e){}
  if(!(siteIdx(v)>=0 || v==="end" || v==="report")) v = "d0";
  show(v);
  try{
    DB.db = await idbOpen();
    const raw = await idbGet("state2");
    if(raw){ state = normalize(JSON.parse(raw)); shown = null; bindInfo(); if(state.info.no.trim() && state.info.name.trim()) setInfoOpen(false); show(v); setStatus("이전에 적은 기록을 불러왔어요"); }
    else shown = SITES.map(()=>false);
  }catch(e){ setStatus("이 브라우저에는 저장되지 않아요. 아래 [백업 저장]을 자주 눌러 주세요.", true); }
})();
